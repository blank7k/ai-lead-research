[project]
name = "lead-research-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.1.1",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "langgraph>=1.2.8",
    "loguru>=0.7.3",
    "playwright>=1.61.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "trafilatura>=2.1.0",
    "streamlit>=1.41.0",
]

[project.scripts]
leadresearch = "batch_main:cli_entrypoint"

[tool.setuptools]
packages = ["agents", "batch", "config", "models", "prompts", "schemas", "services"]
py-modules = ["batch_main", "main"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
